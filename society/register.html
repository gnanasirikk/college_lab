<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><div class="logo">Harmony Heights Society</div><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></header>
<main>
<section class="form-box">
<h2>User Registration</h2>
<form>
<input type="text" placeholder="Full Name" required>
<input type="text" placeholder="Flat / House Number" required>
<input type="email" placeholder="Email" required>
<input type="tel" placeholder="Mobile Number" required>
<input type="password" placeholder="Password" required>
<input type="password" placeholder="Confirm Password" required>
<select required>
<option>Owner</option>
<option>Tenant</option>
</select>
<button class="btn">Register</button>
</form>
</section>
</main>
<footer>© 2026 Harmony Heights Society</footer>
</body>
</html>
