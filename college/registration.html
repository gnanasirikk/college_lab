<!DOCTYPE html>
<html>
<head>
<title>Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>Event Registration</h2>

<form>

<input type="text" class="form-control mb-3" placeholder="Student Name">

<input type="text" class="form-control mb-3" placeholder="Roll Number">

<input type="text" class="form-control mb-3" placeholder="Branch">

<input type="email" class="form-control mb-3" placeholder="Email">

<input type="number" class="form-control mb-3" placeholder="Mobile Number">

<select class="form-select mb-3">
<option>Technical Quiz</option>
<option>Hackathon</option>
<option>Coding Contest</option>
<option>Project Expo</option>
</select>

<button class="btn btn-success">
Register
</button>

</form>

<div class="alert alert-success mt-3">
Registration Successful!
</div>

</div>

</body>
</html>
