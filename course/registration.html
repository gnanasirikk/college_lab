<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4">Course Registration</h2>

    <form>
        <input type="text" class="form-control mb-3" placeholder="Student Name">

        <input type="email" class="form-control mb-3" placeholder="Email">

        <input type="number" class="form-control mb-3" placeholder="Mobile Number">

        <label>Gender</label>
        <div class="mb-3">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender" class="ms-3"> Female
        </div>

        <select class="form-select mb-3">
            <option>Select Course</option>
            <option>Web Development</option>
            <option>Python Programming</option>
            <option>Data Science</option>
            <option>AI & Machine Learning</option>
            <option>Java Programming</option>
            <option>Cloud Computing</option>
        </select>

        <input type="text" class="form-control mb-3" placeholder="Qualification">

        <textarea class="form-control mb-3" placeholder="Address"></textarea>

        <label>Upload Resume</label>
        <input type="file" class="form-control mb-3">

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">I accept Terms & Conditions</label>
        </div>

        <button type="button" class="btn btn-primary">Submit</button>
    </form>

    <div class="alert alert-success mt-4">
        Registration Successful!
    </div>
</div>

</body>
</html>
